[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tuicodingagent"
version = "0.2.0"
description = "Claude Code 风格的终端 AI 编程助手"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TUICodingAgent contributors" }]
dependencies = [
    "httpx>=0.27,<1",
    "mcp>=1.13,<2",
    "PyYAML>=6,<7",
    "textual>=0.89,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]

[project.scripts]
tuicodingagent = "tuicodingagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tuicodingagent = ["tui/*.tcss", "skills/builtin/*.md", "subagent/builtin/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["TODO", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
